name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Build image
        run: docker build -t masareef .

      # Building only proves the image assembles. Importing the agent inside it
      # proves every module the bot needs was copied in and installed.
      - name: Import check inside the image
        run: docker run --rm -e TELEGRAM_TOKEN=ci masareef python -c "import graph_agent, agent, llm, db, privacy, api; print('imports ok')"