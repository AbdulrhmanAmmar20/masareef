name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Build image
        run: docker build -t masareef .

      # Building only proves the image assembles. Importing the agent inside it
      # proves every module the bot needs was copied in and installed.
      - name: Import check inside the image
        run: docker run --rm -e TELEGRAM_TOKEN=ci masareef python -c "import graph_agent, agent, llm, db, privacy, api; print('imports ok')"

      # compose.yaml and the Caddyfile are deployed as-is, so a typo in either
      # would take the server down. Validate both before anything ships.
      - name: Validate compose file
        run: touch .env && docker compose config --quiet

      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
